name: CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: ['main']
  workflow_dispatch:

# Cancel superseded runs for the same PR. `synchronize` fires on every push to an
# open PR, so without this each push started another full wheel matrix while the
# previous one kept running to completion. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Reference: https://github.com/scikit-learn/scikit-learn/blob/main/.github/workflows
jobs:
  # The wheel matrix is selected per event. Pull requests build a reduced set;
  # pushes to main and manual runs build the full set.
  #
  # This job only chooses the matrix -- see the comment on build_wheels for why
  # the PR set is safe.
  set_matrix:
    name: Select build matrix
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select matrix for ${{ github.event_name }}
        id: select
        run: |
          set -euo pipefail

          # Reduced set for pull requests. Linux covers every supported Python
          # (it is the cheapest runner); macOS arm64 / 3.11 is retained because
          # the code-coverage job consumes the artifact this entry uploads;
          # Windows 3.11 is kept as a smoke check for the non-POSIX path.
          read -r -d '' PR_MATRIX <<'JSON' || true
          {"include":[
            {"os":"ubuntu-latest","python":310,"platform_id":"manylinux_x86_64","manylinux_image":"manylinux_2_28"},
            {"os":"ubuntu-latest","python":311,"platform_id":"manylinux_x86_64","manylinux_image":"manylinux_2_28"},
            {"os":"ubuntu-latest","python":312,"platform_id":"manylinux_x86_64","manylinux_image":"manylinux_2_28"},
            {"os":"ubuntu-latest","python":313,"platform_id":"manylinux_x86_64","manylinux_image":"manylinux_2_28"},
            {"os":"ubuntu-latest","python":314,"platform_id":"manylinux_x86_64","manylinux_image":"manylinux_2_28"},
            {"os":"macos-14","python":311,"platform_id":"macosx_arm64"},
            {"os":"windows-latest","python":311,"platform_id":"win_amd64"}
          ]}
          JSON

          # Full set for pushes to main and manual runs.
          read -r -d '' FULL_MATRIX <<'JSON' || true
          {"include":[
            {"os":"windows-latest","python":310,"platform_id":"win_amd64"},
            {"os":"windows-latest","python":311,"platform_id":"win_amd64"},
            {"os":"windows-latest","python":312,"platform_id":"win_amd64"},
            {"os":"windows-latest","python":313,"platform_id":"win_amd64"},
            {"os":"windows-latest","python":314,"platform_id":"win_amd64"},
            {"os":"ubuntu-latest","python":310,"platform_id":"manylinux_x86_64","manylinux_image":"manylinux_2_28"},
            {"os":"ubuntu-latest","python":311,"platform_id":"manylinux_x86_64","manylinux_image":"manylinux_2_28"},
            {"os":"ubuntu-latest","python":312,"platform_id":"manylinux_x86_64","manylinux_image":"manylinux_2_28"},
            {"os":"ubuntu-latest","python":313,"platform_id":"manylinux_x86_64","manylinux_image":"manylinux_2_28"},
            {"os":"ubuntu-latest","python":314,"platform_id":"manylinux_x86_64","manylinux_image":"manylinux_2_28"},
            {"os":"macos-15-intel","python":310,"platform_id":"macosx_x86_64"},
            {"os":"macos-15-intel","python":311,"platform_id":"macosx_x86_64"},
            {"os":"macos-15-intel","python":312,"platform_id":"macosx_x86_64"},
            {"os":"macos-15-intel","python":313,"platform_id":"macosx_x86_64"},
            {"os":"macos-15-intel","python":314,"platform_id":"macosx_x86_64"},
            {"os":"macos-14","python":310,"platform_id":"macosx_arm64"},
            {"os":"macos-14","python":311,"platform_id":"macosx_arm64"},
            {"os":"macos-14","python":312,"platform_id":"macosx_arm64"},
            {"os":"macos-14","python":313,"platform_id":"macosx_arm64"},
            {"os":"macos-14","python":314,"platform_id":"macosx_arm64"}
          ]}
          JSON

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SELECTED="$PR_MATRIX"
          else
            SELECTED="$FULL_MATRIX"
          fi

          echo "matrix=$(echo "$SELECTED" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Selected $(echo "$SELECTED" | jq '.include | length') matrix entries for ${{ github.event_name }}."

  # Wheels published to PyPI are built by release.yml / pre-release.yml, which
  # each carry their own complete 20-entry matrix. This job is CI validation
  # only, so reducing it for pull requests does not change what ships.
  build_wheels:
    needs: set_matrix
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:

      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false

      matrix: ${{ fromJSON(needs.set_matrix.outputs.matrix) }}

    # (matrix entries are generated in set_matrix above)
    steps:
      - name: Checkout PyQASM
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          # cibuildwheel is designed to build wheels for multiple Python versions. 
          # It does this by downloading and using the appropriate Python versions internally, 
          # independent of the Python version used to invoke cibuildwheel

          # Thus, the matrix.python is not required here, only for setting up builds
          python-version: "3.11"

      - name: Build and Test Wheels
        env: 
          # since cibuildwheel builds for all python versions >= current version, we need to 
          # restrict it to the one used in this job
          CIBW_BUILD: "cp${{ matrix.python }}-${{ matrix.platform_id }}"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_BEFORE_BUILD: bash {project}/bin/cibw/pre_build.sh {project}
          CIBW_TEST_EXTRAS: "test,cli,pulse"
          CIBW_TEST_COMMAND: bash {project}/bin/cibw/test_wheel.sh {project}
          CIBW_BUILD_VERBOSITY: 1

        run: bash bin/cibw/build_wheels.sh

      # Used for code coverage later
      - name: Upload built package
        if: ${{ matrix.os == 'macos-14' && matrix.python == 311 }}
        uses: actions/upload-artifact@v7
        with:
          name: package-wheel-cp${{ matrix.python }}-${{ matrix.os }}
          path: dist/*.whl

  build_sdist:
    name: Source distribution
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pyqasm
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build source distribution
        run: bash bin/build_sdist.sh

      - name: Test source distribution
        run: bash bin/test_sdist.sh


  # We need a separate job for coverage as the build job is run inside a docker container. 
  # Since coverage uses files generated after running the tests, we need to run the tests on 
  # the host machine
  code-coverage:
    if: ${{ github.event.pull_request.draft == false }}
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            python: 311
            platform_id: macosx_arm64
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
          cache: pip

      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          name: package-wheel-cp${{ matrix.python }}-${{ matrix.os }}
          path: dist

      - name: Install and Test wheel with extras
        run: |
          pip install setuptools
          bash bin/install_wheel_extras.sh dist --type wheel --extra test --extra cli --extra pulse
          python -m pytest --cov=pyqasm tests/ --cov-report=html --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: ${{ matrix.python == 311 }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./build/coverage/coverage.xml
          verbose: true